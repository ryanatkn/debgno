# preseed.cfg — Debian 13 (Trixie) minimal GNOME installer
#
# Usage: Boot netinst ISO, press 'e' at GRUB, add to linux line:
#   auto=true priority=high preseed/url=https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/preseed.cfg
#
# Priority 'high' (not 'critical') ensures locale/timezone/keyboard prompts appear.

# --- Locale, timezone, keyboard: prompt user ---
# (left unpreseeded so installer prompts)

# --- Network ---
d-i netcfg/choose_interface select auto
# Hostname: prompt user (no default preseeded)

# --- Mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

# --- Archive areas ---
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

# --- Account: no root, prompt for user ---
d-i passwd/root-login boolean false
# Username and password: prompt user (no defaults preseeded)

# --- Partitioning: guided, full disk, encrypted LVM ---
d-i partman-auto/method string crypto
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Disk selection: unpreseeded — auto-selects on single-disk, prompts on multi-disk

# --- Package selection: minimal ---
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# --- Bootloader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# --- late_command: fetch and run post-install ---
# SHA256 hashes are computed at generation time and baked in for integrity verification.
# Download manifest is defined in DOWNLOAD_FILES (src/config.ts).
d-i preseed/late_command string \
    set -e; \
    mkdir -p /target/tmp/debgno; \
    wget -O /target/tmp/post-install.sh https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/post-install.sh || { echo "FATAL: failed to download post-install.sh"; exit 1; }; \
    echo "ac61bec04448b110af2e75bc93e64dc0b745c4b8f3e1b877d183f3205c134063  /target/tmp/post-install.sh" | sha256sum -c - || { echo "FATAL: SHA256 mismatch for post-install.sh"; exit 1; }; \
    wget -O /target/usr/local/bin/setup-nvidia.sh https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/setup-nvidia.sh || { echo "FATAL: failed to download setup-nvidia.sh"; exit 1; }; \
    echo "e787c4f22cdca72a700df7036358306b0a212f50952e657580233ddd51441df5  /target/usr/local/bin/setup-nvidia.sh" | sha256sum -c - || { echo "FATAL: SHA256 mismatch for setup-nvidia.sh"; exit 1; }; \
    wget -O /target/usr/local/bin/setup-tx.sh https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/setup-tx.sh || { echo "FATAL: failed to download setup-tx.sh"; exit 1; }; \
    echo "f7366d800a65022a91612ab4ad91170e91aed6381ed7ff6251f5de80d252c37e  /target/usr/local/bin/setup-tx.sh" | sha256sum -c - || { echo "FATAL: SHA256 mismatch for setup-tx.sh"; exit 1; }; \
    wget -O /target/usr/local/bin/verify.sh https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/verify.sh || { echo "FATAL: failed to download verify.sh"; exit 1; }; \
    echo "ef8f260106f9bd7f86ef8f5f83ba5d14aa1032166924e9d24a084936bc36067c  /target/usr/local/bin/verify.sh" | sha256sum -c - || { echo "FATAL: SHA256 mismatch for verify.sh"; exit 1; }; \
    wget -O /target/tmp/debgno/mozilla.sources https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/mozilla.sources || { echo "FATAL: failed to download mozilla.sources"; exit 1; }; \
    echo "a6aaec8aa3175a473bd21b740c028d863baa6fc28768b384ddad5fb9368b6f42  /target/tmp/debgno/mozilla.sources" | sha256sum -c - || { echo "FATAL: SHA256 mismatch for mozilla.sources"; exit 1; }; \
    wget -O /target/tmp/debgno/mozilla-pin https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/mozilla-pin || { echo "FATAL: failed to download mozilla-pin"; exit 1; }; \
    echo "69320fd0b7f950877803aefe5ba78e8bcf21350d3ba2a05646a982edb6a7a372  /target/tmp/debgno/mozilla-pin" | sha256sum -c - || { echo "FATAL: SHA256 mismatch for mozilla-pin"; exit 1; }; \
    wget -O /target/tmp/debgno/policies.json https://raw.githubusercontent.com/ryanatkn/debgno/main/distro/policies.json || { echo "FATAL: failed to download policies.json"; exit 1; }; \
    echo "95ddb6abddba79aa79dc3f9db45cdd35eb26f2940ac4396ee8b2fd26f6bc4b6d  /target/tmp/debgno/policies.json" | sha256sum -c - || { echo "FATAL: SHA256 mismatch for policies.json"; exit 1; }; \
    chmod +x /target/tmp/post-install.sh /target/usr/local/bin/setup-nvidia.sh /target/usr/local/bin/setup-tx.sh /target/usr/local/bin/verify.sh; \
    in-target /tmp/post-install.sh

# --- Finish ---
d-i finish-install/reboot_in_progress note
